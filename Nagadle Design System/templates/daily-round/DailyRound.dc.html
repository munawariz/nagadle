<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Daily round screen" description="Nagadle question screen: progress rail, question, four answer cards, lock-in CTA." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="min-height:100vh;background:#FAFAED;font-family:'M PLUS Rounded 1c',sans-serif;display:flex;flex-direction:column;align-items:center">
<div style="width:100%;position:sticky;top:0;background:#FAFAED;border-bottom:1px solid #E2E2CF;z-index:2">
<div style="max-width:420px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px"><img src="../../assets/mascot-nagadle.png" alt="Nagadle" style="width:38px;height:auto"><span style="font-weight:900;font-size:24px;letter-spacing:-0.03em;color:#000">nagadle</span></div>
<span style="font-weight:800;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#74745F">2 of 5</span>
</div>
</div>
<div style="width:100%;max-width:420px;padding:24px 20px 48px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:4px">
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.StepDots" orientation="horizontal" size="16" dc-props="{{ doneStep }}" hint-size="16px,16px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.WaveLine" tone="done" width="44" hint-size="44px,14px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.StepDots" orientation="horizontal" size="16" dc-props="{{ currentStep }}" hint-size="16px,16px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.WaveLine" width="44" hint-size="44px,14px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.StepDots" orientation="horizontal" size="16" dc-props="{{ nextStep }}" hint-size="16px,16px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.WaveLine" width="44" hint-size="44px,14px"></x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.StepDots" orientation="horizontal" size="16" dc-props="{{ nextStep }}" hint-size="16px,16px"></x-import>
</div>
<h1 style="margin:0;font-weight:900;font-size:32px;line-height:1.15;letter-spacing:-0.01em;color:#000">A turtle in Japanese folklore lives how many years?</h1>
<div style="display:flex;flex-direction:column;gap:12px">
<div onClick="{{ pick0 }}" style="padding:16px 20px;border-radius:10px;background:#FFFFFF;box-shadow:0 6px 18px rgba(73,79,33,0.10);cursor:pointer;font-weight:800;font-size:16px;color:#000">One hundred</div>
<div onClick="{{ pick1 }}" style="padding:16px 20px;border-radius:10px;background:#494F21;color:#FAFAED;cursor:pointer;font-weight:800;font-size:16px">One thousand</div>
<div onClick="{{ pick2 }}" style="padding:16px 20px;border-radius:10px;background:#FFFFFF;box-shadow:0 6px 18px rgba(73,79,33,0.10);cursor:pointer;font-weight:800;font-size:16px;color:#000">Ten thousand</div>
<div onClick="{{ pick3 }}" style="padding:16px 20px;border-radius:10px;background:#FFFFFF;box-shadow:0 6px 18px rgba(73,79,33,0.10);cursor:pointer;font-weight:800;font-size:16px;color:#000">Forever</div>
</div>
<div style="display:flex;flex-direction:column;gap:16px">
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.Button" full-width="{{ true }}" hint-size="100%,44px">Lock it in</x-import>
<x-import component-from-global-scope="NagadleDesignSystem_bb132e.ArrowLink" href="#" hint-size="90px,20px">Back to today</x-import>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return {
      doneStep: { steps: [{ state: 'done' }] },
      currentStep: { steps: [{ state: 'current' }] },
      nextStep: { steps: [{ state: 'next' }] },
      pick0: noop, pick1: noop, pick2: noop, pick3: noop,
    };
  }
}

</script>
</body>
</html>
