<!-- @dsCard group="Colors" viewport="700x170" name="Answer states" subtitle="Correct, close, wrong, empty, locked — fills with their ink pairing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:8px;overflow:hidden;width:120px}.chip i{display:block;height:64px}.chip b{display:block;font-size:11px;font-weight:800;padding:6px 0 0}.chip s{display:block;font-size:10px;font-weight:500;text-decoration:none;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.st{width:124px;height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}</style></head><body><div class="sw">
<div><div class="st" style="background:var(--state-correct);color:var(--state-correct-ink)">Correct</div><s class="lbl">--state-correct</s></div>
<div><div class="st" style="background:var(--state-close);color:var(--state-close-ink)">Close</div><s class="lbl">--state-close</s></div>
<div><div class="st" style="background:var(--state-wrong);color:var(--state-wrong-ink)">Wrong</div><s class="lbl">--state-wrong</s></div>
<div><div class="st" style="background:var(--state-empty);color:var(--text-muted);box-shadow:inset 0 0 0 2px var(--border-subtle)">Empty</div><s class="lbl">--state-empty</s></div>
<div><div class="st" style="background:var(--state-locked);color:var(--cream)">Locked</div><s class="lbl">--state-locked</s></div>
</div></body></html>
