<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:8px;overflow:hidden;width:120px}.chip i{display:block;height:64px}.chip b{display:block;font-size:11px;font-weight:800;padding:6px 0 0}.chip s{display:block;font-size:10px;font-weight:500;text-decoration:none;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.s{width:150px;height:84px;background:var(--white);border-radius:10px}</style></head><body><div class="sw" style="gap:24px;padding:8px 0 16px">
<div><div class="s" style="box-shadow:var(--shadow-card)"></div><div class="lbl">--shadow-card</div></div>
<div><div class="s" style="box-shadow:var(--shadow-card-hover)"></div><div class="lbl">--shadow-card-hover</div></div>
<div><div class="s" style="box-shadow:var(--shadow-sheet)"></div><div class="lbl">--shadow-sheet</div></div>
<div><div class="s" style="box-shadow:none;background:var(--moss-900)"></div><div class="lbl">active card — no shadow</div></div>
</div></body></html>
