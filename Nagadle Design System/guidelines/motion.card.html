<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:8px;overflow:hidden;width:120px}.chip i{display:block;height:64px}.chip b{display:block;font-size:11px;font-weight:800;padding:6px 0 0}.chip s{display:block;font-size:10px;font-weight:500;text-decoration:none;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.t{width:110px;height:56px;border-radius:10px;background:var(--lime-500);animation:slide 2.4s infinite}@keyframes slide{0%,10%{transform:translateX(0)}50%,60%{transform:translateX(150px)}100%{transform:translateX(0)}}</style></head><body>
<div class="row" style="gap:36px"><div class="t" style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></div><div style="display:flex;flex-direction:column;gap:6px"><div class="lbl">--dur-fast 120ms · hover, press</div><div class="lbl">--dur 180ms · enter, focus</div><div class="lbl">--dur-slow 320ms · reveals, sheets</div><div class="lbl">--ease-out · everything</div><div class="lbl">--ease-pop · mascot + result only</div></div></div></body></html>
